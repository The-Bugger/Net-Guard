# NetGuard Configuration
# All settings below have documented defaults.
# Changes applied via PUT /api/v1/settings take effect immediately without restart.

network_interface: ''
syn_flood_threshold: 150
syn_flood_window: 3
port_scan_threshold: 20
port_scan_window: 10
brute_force_threshold: 10
brute_force_window: 60
icmp_flood_threshold: 100
icmp_flood_window: 3
slow_http_threshold: 10
slow_http_window: 10
block_duration: 120
dashboard_refresh_interval: 1
rules_enabled:
  syn_flood: true
  port_scan: true
  sql_injection: true
  brute_force: true
  arp_spoof: true
  icmp_flood: true
  slow_http: true
  dns_tunnel: true
debug: false
