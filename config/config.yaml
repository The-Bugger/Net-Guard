# NetGuard IDPS Configuration
# ============================================================
# All settings have documented defaults and valid ranges.
# Changes submitted via PUT /api/v1/settings are applied
# immediately in memory and persisted here without restart.
# If this file is missing or unparseable at startup, the
# Configuration_Manager falls back to the built-in defaults
# listed below and logs a CRITICAL error to logs/errors.log.
# ============================================================

# Network interface to monitor (e.g. eth0, wlan0, en0).
# Leave empty ("") to require the Administrator to select via
# POST /api/v1/monitor/start. Must be a non-empty string when
# monitoring is active.
# Valid values: any non-empty interface name string
network_interface: ""

# ----------------------------------------------------------
# SYN Flood Detection
# ----------------------------------------------------------
# Number of TCP SYN packets from a single source IP within
# the sliding window that triggers a SYN Flood Threat_Event.
# Valid range: integer >= 1 | Default: 100
syn_flood_threshold: 100

# Duration of the sliding time window for SYN flood counting.
# Valid range: integer 1–60 (seconds) | Default: 3
syn_flood_window: 3

# ----------------------------------------------------------
# Port Scan Detection
# ----------------------------------------------------------
# Number of unique destination ports contacted by a single
# source IP within the sliding window that triggers a
# Port Scan Threat_Event.
# Valid range: integer >= 1 | Default: 20
port_scan_threshold: 20

# Duration of the sliding time window for port scan counting.
# Valid range: integer 1–60 (seconds) | Default: 10
port_scan_window: 10

# ----------------------------------------------------------
# Brute Force Login Detection
# ----------------------------------------------------------
# Number of authentication failure indicators from a single
# source IP within the sliding window that triggers a
# Brute Force Threat_Event.
# Valid range: integer >= 1 | Default: 10
brute_force_threshold: 10

# Duration of the sliding time window for brute force counting.
# Valid range: integer 1–300 (seconds) | Default: 60
brute_force_window: 60

# ----------------------------------------------------------
# Prevention
# ----------------------------------------------------------
# How long (in seconds) a blocked IP remains blocked before
# the Prevention_Engine automatically removes the iptables
# DROP rule and sets the blocked_ips record to inactive.
# Valid range: integer 1–3600 (seconds) | Default: 120
block_duration: 120

# ----------------------------------------------------------
# Dashboard
# ----------------------------------------------------------
# How often (in seconds) the dashboard refreshes live stats
# from GET /api/v1/dashboard/live (also controls the SocketIO
# live_stats emit interval).
# Valid range: integer 1–60 (seconds) | Default: 1
dashboard_refresh_interval: 1

# ----------------------------------------------------------
# Detection Rule Toggles
# ----------------------------------------------------------
# Set any rule to false to disable it without a code change
# or application restart. Disabled rules are skipped by the
# Detection_Engine and will not emit Threat_Events.
# Valid values: true | false — Default: true for all rules
rules_enabled:
  syn_flood: true       # SYN_FLOOD_001  — volumetric TCP SYN detection
  port_scan: true       # PORT_SCAN_001  — reconnaissance port sweep detection
  sql_injection: true   # SQL_INJECTION_001 — HTTP payload SQL pattern detection
  brute_force: true     # BRUTE_FORCE_001 — authentication failure rate detection
  arp_spoof: true       # ARP_SPOOF_001  — conflicting ARP reply detection

# ----------------------------------------------------------
# General
# ----------------------------------------------------------
# Enable verbose debug logging to logs/system.log.
# Set to false in production to reduce log volume.
# Valid values: true | false | Default: false
debug: false
