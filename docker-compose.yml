# docker-compose.yml — Net-Guard Enterprise IDPS
# Requirements: 11.2
#
# Starts with: docker compose up
# No manual pre-configuration required.
#
# Services: backend + Redis + nginx reverse-proxy

services:

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netguard-backend
    restart: unless-stopped
    env_file:
      - .env.example          # override with .env in production
    environment:
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "5000"
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "sqlite:////app/database/netguard.db"
    volumes:
      - netguard_db:/app/database
      - netguard_logs:/app/logs
      - netguard_backups:/app/backups
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - netguard_net
    # Allow iptables management (required for firewall blocking)
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: netguard-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - netguard_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx reverse-proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: netguard-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - netguard_net

volumes:
  netguard_db:
  netguard_logs:
  netguard_backups:

networks:
  netguard_net:
    driver: bridge
