<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetGuard — Detection Rules</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/dark-theme.css">
</head>
<body>

<!-- Header -->
<header class="header">
  <button class="hamburger" id="hamburger" aria-label="Toggle navigation" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6"  x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="header-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    NetGuard
  </div>
  <div class="header-spacer"></div>
  <div class="header-time" id="system-time"></div>
</header>

<!-- Sidebar overlay (mobile) -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<div class="app-layout">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <a href="/" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a href="/threats.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      Threats
    </a>
    <a href="/blocked.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      Blocked IPs
    </a>
    <a href="/whitelist.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      Whitelist
    </a>
    <a href="/logs.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Logs
    </a>
    <a href="/rules.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
      Rules
    </a>
    <a href="/settings.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>
  </nav>

  <!-- Main Content -->
  <main class="main-content">

    <div class="page-header-row">
      <div>
        <div class="page-title">Detection Rules</div>
        <div class="page-subtitle">Active rule set — thresholds and detection counts</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span id="rules-status-msg" style="font-size:13px"></span>
        <button class="btn btn-ghost btn-sm" onclick="loadRules()" title="Refresh rules">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Refresh
        </button>
      </div>
    </div>

    <!-- Summary bar -->
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px">
      <div class="kpi-card" style="flex:1;min-width:140px;padding:16px">
        <div class="kpi-label">Total Rules</div>
        <div class="kpi-value" id="stat-total" style="font-size:28px">8</div>
      </div>
      <div class="kpi-card" style="flex:1;min-width:140px;padding:16px">
        <div class="kpi-label">Enabled</div>
        <div class="kpi-value" id="stat-enabled" style="font-size:28px;color:var(--success)">8</div>
      </div>
      <div class="kpi-card" style="flex:1;min-width:140px;padding:16px">
        <div class="kpi-label">Total Detections</div>
        <div class="kpi-value" id="stat-detections" style="font-size:28px;color:var(--warning)">0</div>
      </div>
    </div>

    <!-- Rule cards grid -->
    <div class="rules-grid" id="rules-grid">
      <!-- skeleton placeholders while loading -->
      <div class="rule-card enabled">
        <div style="height:14px;width:60%;background:rgba(255,255,255,0.07);border-radius:4px;margin-bottom:8px" class="skeleton-row"></div>
        <div style="height:10px;width:40%;background:rgba(255,255,255,0.05);border-radius:4px" class="skeleton-row"></div>
      </div>
      <div class="rule-card enabled">
        <div style="height:14px;width:55%;background:rgba(255,255,255,0.07);border-radius:4px;margin-bottom:8px" class="skeleton-row"></div>
        <div style="height:10px;width:35%;background:rgba(255,255,255,0.05);border-radius:4px" class="skeleton-row"></div>
      </div>
      <div class="rule-card enabled">
        <div style="height:14px;width:65%;background:rgba(255,255,255,0.07);border-radius:4px;margin-bottom:8px" class="skeleton-row"></div>
        <div style="height:10px;width:45%;background:rgba(255,255,255,0.05);border-radius:4px" class="skeleton-row"></div>
      </div>
    </div>

    <!-- Fallback table view (shown if grid is empty) -->
    <div id="rules-table-fallback" style="display:none">
      <div class="card">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Rule ID</th>
                <th>Attack Type</th>
                <th>Threshold</th>
                <th>Block Duration</th>
                <th>Detections</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="rules-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </main>
</div>

<div id="notifications"></div>
<div id="toast-container"></div>

<script src="/js/api.js"></script>
<script src="/js/utils.js"></script>
<script>
// Static rule definitions — matches ALL 8 detection engine rules
const RULE_DEFS = [
  {
    id:          'SYN_FLOOD_001',
    attack:      'SYN Flood',
    threshold:   '100 pkts / 3 s',
    block:       '120 s',
    description: 'Detects TCP SYN flood attacks by counting half-open connections from a single source.',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>',
  },
  {
    id:          'PORT_SCAN_001',
    attack:      'Port Scan',
    threshold:   '20 ports / 10 s',
    block:       '120 s',
    description: 'Identifies horizontal or vertical port scanning by tracking distinct destination ports per source IP.',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
  },
  {
    id:          'SQL_INJECTION_001',
    attack:      'SQL Injection',
    threshold:   '1 match',
    block:       '120 s',
    description: 'Pattern-matches TCP payloads for common SQL injection signatures (UNION, SELECT, DROP, etc.).',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
  },
  {
    id:          'BRUTE_FORCE_001',
    attack:      'Brute Force',
    threshold:   '10 fails / 60 s',
    block:       '120 s',
    description: 'Counts repeated failed authentication attempts (SSH port 22, HTTP 401/403) from a single IP.',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
  },
  {
    id:          'ARP_SPOOF_001',
    attack:      'ARP Spoofing',
    threshold:   '2 MACs / IP',
    block:       '120 s',
    description: 'Detects ARP spoofing by tracking IP-to-MAC mappings and flagging conflicting ARP replies.',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  },
  {
    id:          'ICMP_FLOOD_001',
    attack:      'ICMP Flood',
    threshold:   '100 pkts / 3 s',
    block:       '120 s',
    description: 'Detects ICMP ping floods (Smurf-style) by counting Echo Request packets from a single source IP.',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="12" r="10"/><line x1="14.31" y1="8" x2="20.05" y2="17.94"/><line x1="9.69" y1="8" x2="21.17" y2="8"/><line x1="7.38" y1="12" x2="13.12" y2="2.06"/><line x1="9.69" y1="16" x2="3.95" y2="6.06"/><line x1="14.31" y1="16" x2="2.83" y2="16"/><line x1="16.62" y1="12" x2="10.88" y2="21.94"/></svg>',
  },
  {
    id:          'SLOW_HTTP_001',
    attack:      'Slow HTTP',
    threshold:   '10 conns / 10 s',
    block:       '120 s',
    description: 'Detects Slowloris-style attacks where connections to port 80/443 are held open without completing HTTP requests.',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
  },
  {
    id:          'DNS_TUNNEL_001',
    attack:      'DNS Tunneling',
    threshold:   'entropy > 3.5',
    block:       '120 s',
    description: 'Detects DNS tunneling via Shannon entropy analysis of query labels and anomalous TXT/NULL record rates.',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
  },
];

// Clock
setInterval(() => {
  const el = document.getElementById('system-time');
  if (el) el.textContent = new Date().toLocaleTimeString();
}, 1000);

// Mobile sidebar
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('visible');
}

// Status helper
function setStatus(msg, type) {
  const el = document.getElementById('rules-status-msg');
  if (!el) return;
  const colors = { success: 'var(--success)', error: 'var(--danger)', info: 'var(--text-muted)' };
  el.textContent = msg;
  el.style.color = colors[type] || 'var(--text-muted)';
  if (type !== 'error') setTimeout(() => { el.textContent = ''; }, 4000);
}

async function loadRules() {
  try {
    const data = await NetGuardAPI.getRuleStats();
    const apiRules = data.rules || [];

    // Build a count map keyed by attack_type
    const countMap = {};
    apiRules.forEach(r => { countMap[r.attack_type] = r.count || 0; });

    // Total detections
    const totalDet = Object.values(countMap).reduce((a, b) => a + b, 0);
    document.getElementById('stat-total').textContent      = RULE_DEFS.length;
    document.getElementById('stat-enabled').textContent    = RULE_DEFS.length;
    document.getElementById('stat-detections').textContent = totalDet;

    renderCards(countMap);
    setStatus('Rules loaded', 'success');
  } catch (err) {
    setStatus('Failed to load stats: ' + err.message, 'error');
    // Still render cards with 0 counts so the page is useful
    renderCards({});
  }
}

function renderCards(countMap) {
  const grid = document.getElementById('rules-grid');

  grid.innerHTML = RULE_DEFS.map(rule => {
    const count = countMap[rule.attack] || 0;
    const hasHits = count > 0;
    return `
      <div class="rule-card enabled" role="article" aria-label="${escHtml(rule.attack)} rule">
        <div class="rule-card-header">
          <div style="display:flex;align-items:flex-start;gap:10px">
            <div style="color:var(--info);flex-shrink:0;margin-top:1px">${rule.icon}</div>
            <div>
              <div class="rule-card-title">${escHtml(rule.attack)}</div>
              <div class="rule-card-id">${escHtml(rule.id)}</div>
            </div>
          </div>
          <span class="status-badge active" style="font-size:11px;padding:2px 10px;white-space:nowrap">
            <span class="status-dot"></span> Active
          </span>
        </div>

        <p style="font-size:12px;color:var(--text-muted);line-height:1.55;margin-bottom:12px">${escHtml(rule.description)}</p>

        <div class="rule-meta">
          <div class="rule-meta-item">
            <div class="rule-meta-label">Threshold</div>
            <div class="rule-meta-value">${escHtml(rule.threshold)}</div>
          </div>
          <div class="rule-meta-item">
            <div class="rule-meta-label">Block Duration</div>
            <div class="rule-meta-value">${escHtml(rule.block)}</div>
          </div>
        </div>

        <div class="rule-footer">
          <span class="rule-status-text enabled">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12" style="vertical-align:-1px;margin-right:3px"><polyline points="20 6 9 17 4 12"/></svg>
            Enabled
          </span>
          <span class="detection-pill ${hasHits ? 'has-detections' : ''}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="11" height="11"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            ${count} detection${count !== 1 ? 's' : ''}
          </span>
        </div>
      </div>
    `;
  }).join('');
}

document.addEventListener('DOMContentLoaded', loadRules);
</script>
</body>
</html>
