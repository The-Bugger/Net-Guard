<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetGuard — Whitelist</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/dark-theme.css">
</head>
<body>
<header class="header">
  <div class="header-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>NetGuard</div>
  <div class="header-spacer"></div>
  <div class="header-time" id="system-time"></div>
</header>
<div class="app-layout">
  <nav class="sidebar">
    <a href="/" class="nav-item">Dashboard</a>
    <a href="/threats.html" class="nav-item">Threats</a>
    <a href="/blocked.html" class="nav-item">Blocked IPs</a>
    <a href="/whitelist.html" class="nav-item active">Whitelist</a>
    <a href="/logs.html" class="nav-item">Logs</a>
    <a href="/rules.html" class="nav-item">Rules</a>
    <a href="/settings.html" class="nav-item">Settings</a>
  </nav>
  <main class="main-content">
    <div class="page-title">Whitelist</div>
    <div class="card" style="margin-bottom:16px">
      <div class="section-title">Add Trusted Device</div>
      <div style="display:flex;gap:12px">
        <input id="wl-ip" class="input" placeholder="IP address (e.g. 192.168.1.1)" style="width:220px">
        <input id="wl-desc" class="input" placeholder="Description (optional)" style="flex:1">
        <button class="btn btn-primary" onclick="addEntry()">Add</button>
      </div>
    </div>
    <div class="card">
      <table class="data-table">
        <thead><tr><th>IP Address</th><th>Description</th><th>Added</th><th>Added By</th><th>Action</th></tr></thead>
        <tbody id="wl-tbody"><tr><td colspan="5" class="empty-state"><p>Whitelist is empty.</p></td></tr></tbody>
      </table>
    </div>
  </main>
</div>
<div id="notifications"></div>
<script src="/js/api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => { loadWL(); setInterval(() => { document.getElementById('system-time').textContent = new Date().toLocaleTimeString(); }, 1000); });
async function loadWL() {
  const data = await NetGuardAPI.getWhitelist();
  const entries = data.whitelist || [];
  const tbody = document.getElementById('wl-tbody');
  if (!entries.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state"><p>Whitelist is empty.</p></td></tr>'; return; }
  tbody.innerHTML = entries.map(e => `<tr><td><code>${escHtml(e.ip_address)}</code></td><td>${escHtml(e.description || '—')}</td><td>${new Date(e.created_at).toLocaleString()}</td><td>${escHtml(e.created_by || 'admin')}</td><td><button class="btn btn-danger btn-sm" data-ip="${escHtml(e.ip_address)}" onclick="removeEntry(this.dataset.ip)">Remove</button></td></tr>`).join('');
}
async function addEntry() {
  const ip = document.getElementById('wl-ip').value.trim();
  const desc = document.getElementById('wl-desc').value.trim();
  if (!ip) return;
  try { await NetGuardAPI.addWhitelist(ip, desc); document.getElementById('wl-ip').value=''; document.getElementById('wl-desc').value=''; showN(`${ip} added.`,'success'); loadWL(); } catch(e){showN(e.message,'error');}
}
async function removeEntry(ip) {
  if (!confirm(`Remove ${ip} from whitelist?`)) return;
  try { await NetGuardAPI.removeWhitelist(ip); showN(`${ip} removed.`,'success'); loadWL(); } catch(e){showN(e.message,'error');}
}
function showN(m,t){const c=document.getElementById('notifications');if(!c)return;const el=document.createElement('div');el.className=`notification ${t}`;el.textContent=m;c.appendChild(el);setTimeout(()=>el.remove(),5000);}
</script>
</body>
</html>
